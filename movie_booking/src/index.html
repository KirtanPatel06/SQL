<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Seat Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");

        body {
            font-family: "Outfit", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div
        class="max-w-7xl w-full bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50">
        <div class="text-center mb-10">
            <div class="flex justify-between">
                <button id="login-button" ;
                    class="flex h-12 w-40 items-center justify-center rounded-lg border border-blue-600 bg-blue-900/40 font-semibold text-blue-100 shadow-md transition-all duration-200 hover:-translate-y-0.5 hover:border-blue-400 hover:bg-blue-700 hover:shadow-blue-900/40 active:translate-y-0 active:scale-95">
                    Login
                </button>

                <button id="reset-button" ;
                    class="flex h-12 w-40 items-center justify-center rounded-lg border border-red-600 bg-red-900/40 font-semibold text-red-100 shadow-md transition-all duration-200 hover:-translate-y-0.5 hover:border-red-400 hover:bg-red-700 hover:shadow-red-900/40 active:translate-y-0 active:scale-95">
                    🗑️ Reset DB
                </button>
            </div>
            <h1
                class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4 tracking-tight">
                Baburao Cinema - Now Showing<br />
                <br />
                <span class="text-red-400">
                    <span class="font-bold">Dhurandhar The Revenge</span>
                </span>
            </h1>
            <p class="text-slate-400 text-lg">Jassi ko ghar ki yaad kyu nhi aai?</p>
        </div>

        <div class="flex justify-center mb-10">
            <div class="bg-slate-900/50 rounded-full px-6 py-3 border border-slate-700 flex gap-8 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.6)]"></div>
                    <span class="text-slate-300 font-medium tracking-wide">Available</span>
                </div>
                <div class="w-px h-6 bg-slate-700"></div>
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 rounded-full bg-rose-500/20 border border-rose-500/50"></div>
                    <span class="text-slate-400 font-medium tracking-wide">Booked</span>
                </div>
            </div>
        </div>

        <div class="flex justify-center">
            <div class="bg-slate-900/40 p-8 rounded-2xl border border-slate-700/50 shadow-inner">
                <table id="tbl" class="border-separate border-spacing-4 mx-auto"></table>
            </div>
        </div>
    </div>

    <script>
        async function run() {
            const tbl = document.getElementById("tbl");
            // const res = await fetch("/seats");
            const res = await fetch("http://localhost:8080/seats");
            const resarray = await res.json();
            const j = resarray.sort((a, b) => a.id - b.id);
            let tr;
            for (let i = 0; i < j.length; i++) {
                if (i % 8 === 0) tr = document.createElement("tr");

                const td = document.createElement("td");

                // Base aesthetic classes - added 'relative group' for tooltip positioning
                const baseClasses =
                    "w-32 h-32 rounded-2xl text-center align-middle text-2xl font-bold transition-all duration-300 select-none relative group";

                if (j[i].isbooked) {
                    td.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;
                    td.innerHTML = `
                    <span class="relative z-10">${j[i].id}</span>
                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-2xl z-50 pointer-events-none font-normal shadow-[0_10px_25px_rgba(0,0,0,0.5)]">
                        Booked by: <span class="font-bold text-white ml-1">${j[i].name}</span>
                        <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px] border-[6px] border-transparent border-t-slate-700"></div>
                        <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[2px] border-[5px] border-transparent border-t-slate-900"></div>
                    </div>
                `;
                } else {
                    td.className = `${baseClasses} bg-emerald-500 text-white border-2 border-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.3)] cursor-pointer hover:bg-emerald-400 hover:-translate-y-1.5 hover:shadow-[0_10px_25px_rgba(16,185,129,0.5)] active:scale-95 active:shadow-[0_0_10px_rgba(16,185,129,0.3)]`;
                    td.innerHTML = `<span class="relative z-10">${j[i].id}</span>`;
                }

                td.addEventListener("click", async function (e) {
                    const currentTd = e.currentTarget;
                    if (currentTd.classList.contains("cursor-not-allowed")) {
                        return; // Seat is already taken
                    }

                    const token = localStorage.getItem("accessToken");
                    if (!token) {
                        alert("Please login first to book a seat.");
                        window.location.href = "/login";
                        return;
                    }

                    try {
                        const seatId = j[i].id; // Safe from loop closure

                        const confirmed = confirm(`Do you want to book Seat ${seatId}?`);
                        if (!confirmed)
                            return;

                        // const res = await fetch(`${id}/${name}`, { method: "PUT" });
                        const res = await fetch(`http://localhost:8080/book/${seatId}`, {
                            method: "PUT",
                            headers: {
                                Authorization: `Bearer ${token}`
                            }
                        });

                        const data = await res.json();

                        if (!res.ok) {
                            alert(data.message);
                            return;
                        } else {
                            alert(data.message);
                            // Visually transition to booked state upon success
                            currentTd.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;
                            currentTd.innerHTML = `
                            <span class="relative z-10">${seatId}</span>
                            <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-2xl z-50 pointer-events-none font-normal shadow-[0_10px_25px_rgba(0,0,0,0.5)]">
                                Booked by: <span class="font-bold text-white ml-1">${data.data.name}</span>
                                <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px] border-[6px] border-transparent border-t-slate-700"></div>
                                <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[2px] border-[5px] border-transparent border-t-slate-900"></div>
                            </div>
                        `;
                        }
                    } catch (ex) {
                        alert("error booking " + ex);
                    }
                });
                tr.appendChild(td);
                tbl.appendChild(tr);
            }


            // Reset DB
            const resetButton = document.getElementById("reset-button");
            resetButton.addEventListener('click', async () => {
                // Agar tum Server ke Route se hi 'index.html' return kar rahe ho,             using app.get("/"). Aur kyunki Kyunki tumhara Server Port '8080' par chal raha hai, to 'index.html' bhi usi same port '8080' pe load hogi. Isliye jab tum Browser se '/reset' request bhejoge, To Browser automatically current Server(localhost:8080) par hi request bhej dega. Matlab dono same Port par chal rahe hain, isliye URL explicitly likhne ki koi zarurat nahi hai.

                // const response = await fetch("/reset", { method: "PUT"});



                // Agar tum 'Live Preview' ya 'Live Server' se 'index.html' run kar rahe ho. To "Live Preview" uss file ko Port '3000' pe run karta hai. Kyunki 'index.html' ab Port '3000' par chal rahi hai, aur tumhara Express Server Port '8080' par chal raha hai. To jab tum 'reset' ki request bhejoge Frontend se, To Browser request Port 3000 par bhej dega, kyunki by default Browser current website wale Server ko hi request bhejta hai. Par hamara server to '8080' pe chal raha hai. Isliye hame Browser ko explicitly batana padega, ki request Port 8080 par bhejni hai.

                // const response = await fetch("http://localhost:8080/reset", { method: "PUT" });

                // Jab tum Port 3000 se Port 8080 par Request bhejte ho, To Request pehle Express Server tak pahunchti hai. Server Request ko Process bhi karta hai, aur Response bhi bhej deta hai. Lekin ab Response Browser ke paas aata hai. Browser check karta hai ki, "Kya Server ne CORS ki Permission di hai?" Agar Permission nahi di, To Browser us Response ko Frontend mein chal rahi tumhari JavaScript tak pahunchne nahi deta. Matlab Server ne apna kaam kar diya tha, Problem Browser ne create ki, Security Reasons ki wajah se. Isliye Express Server mein 'cors'(Cross-Origin Resource Sharing) middleware use kiya jata hai, taaki Browser Response ko accept kar sake.


                const response = await fetch("http://localhost:8080/reset/db-reset", { method: "PUT" });
                const data = await response.json();
                alert(data.message);
            });


            // Login
            const loginButton = document.getElementById('login-button');
            loginButton.addEventListener('click', async () => {
                window.location.href = "http://localhost:8080/login";
                // window.location.href = "http://127.0.0.1:3000/movie_booking/src/login.html";
            });
        }
        run();
    </script>
</body>

</html>
